<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista descendente</title>

    <style>
        /* Só mudar a cor do sub item o sinal (>) significa filhos*/
        /* (ul li muda todos os descendentes)*/
        ul>li {
            color: blue;
        }
    </style>

</head>

<body>
    <ol>
        <li>Item da lista1</li>
        <li>Item da lista2</li>
        <li>Item da lista3</li>
        <ul>
            <li>Sub Item1</li>
            <li>Sub Item2</li>
            <li>Sub Item3</li>
        </ul>
        <li>Item da lista4</li>
    </ol>

</body>

</html>
