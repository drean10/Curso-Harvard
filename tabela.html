<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            border-collapse: collapse;
            /*colapsa as bordas da tabela*/
            width: 100%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>


</head>

<body>
    <table>
        <theader>
            <tr>
                <th>Oceano</th>
                <th>Profundidade média</th>
                <th>Profundidade máxima</th>
            </tr>
        </theader>

        <tbody>
            <tr>
                <td>Oceano Pacífico</td>
                <td>4,086 m</td>
                <td>11,034 m</td>
            </tr>
            <tr>
                <td>Oceano Atlântico</td>
                <td>3,646 m</td>
                <td>8,486 m</td>
            </tr>
    </table>

    </tbody>
</body>

</html>
