<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamanho dos Elementos CSS</title>
    <style>
        div {
            background-color: lightblue;
            width: 200px;
            height: 400px;
            padding: 20px;
            /*padding adiciona espaço interno ao elemento*/
            margin: 20px;
            /*margin adiciona espaço externo ao elemento*/
        }
    </style>
</head>

<body>
    <div>
        <strong>Tamanho dos Elementos CSS</strong>
    </div>

</body>

</html>
